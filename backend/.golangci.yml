run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - prealloc
    - bodyclose
    - noctx
    - sqlclosecheck

linters-settings:
  gosec:
    excludes:
      - G104 # errors unhandled
      - G204 # subprocess launch
  staticcheck:
    checks: ['all', '-ST1000', '-ST1003']

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
